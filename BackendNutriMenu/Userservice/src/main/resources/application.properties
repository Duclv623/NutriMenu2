spring.config.import=optional:file:../.env[.properties]
spring.application.name=Userservice
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/menufood_users}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.port=${PORT:8083}
app.auth.secure-cookie=${AUTH_SECURE_COOKIE:false}

app.environment=${APP_ENV:development}
app.jwt.issuer=${JWT_ISSUER:http://localhost:8083}
app.jwt.audience=${JWT_AUDIENCE:menufood}
app.jwt.private-key-path=${JWT_PRIVATE_KEY_PATH:}
app.jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:}
app.jwt.ttl-seconds=${JWT_TTL_SECONDS:3600}

server.address=${SERVICE_HOST:127.0.0.1}
